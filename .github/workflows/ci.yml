# Integración continua: en cada push o pull request a main se compila y se prueba todo.
# Si algo falla, el commit aparece con una ✗ roja en GitHub (pestaña Actions).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint, tipos, pruebas y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Pruebas de lógica (Vitest)
        run: npm run test:logica
      - name: Pruebas de componentes (Karma + Jasmine en Chrome)
        run: npm run test:componentes
      - name: Tipos (TypeScript) y build de producción
        run: npm run build
        env:
          VITE_API_URL: /api

  backend:
    name: Backend (compilación con Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilar y empaquetar
        run: mvn -B -ntp package

  docker:
    name: Imagen Docker del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen (igual que en la EC2)
        run: docker build -t holomarket-api backend
