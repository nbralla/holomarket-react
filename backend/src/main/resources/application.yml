# Todos los valores sensibles se leen de variables de entorno.
# Los valores después de ":" son SOLO para desarrollo local.
server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: holomarket-api
  datasource:
    # MySQL de desarrollo en el puerto 3308 (docker-compose.yml). 3306 suele estar ocupado y 3307 lo usa la PokéStore.
    # DB_PARAMS permite cambiar los parámetros de conexión en producción (ej: sslMode=REQUIRED para RDS)
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/${DB_NAME:holomarket}?${DB_PARAMS:createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
    username: ${DB_USER:holomarket}
    password: ${DB_PASSWORD:holomarket123}
  jpa:
    hibernate:
      ddl-auto: update   # en producción usar "validate" + migraciones (Flyway)
    open-in-view: false
    show-sql: false

# Swagger: activo en desarrollo. En producción poner SWAGGER_ENABLED=false
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    display-request-duration: true
  default-produces-media-type: application/json

app:
  jwt:
    # Mínimo 32 caracteres. Si se deja vacío se genera una clave aleatoria al iniciar
    # (los tokens dejan de servir cada vez que se reinicia la API).
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    # Orígenes permitidos separados por coma
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  seed:
    # Contraseñas de las cuentas demo. Se aplican solo al crear los datos (base vacía o "Restablecer datos").
    admin-password: ${ADMIN_PASSWORD:Admin1234}
    user-password: ${DEMO_USER_PASSWORD:Demo1234}
  apitcg:
    # Clave de API TCG (imágenes y precios de mercado). Vive solo en el servidor: el navegador nunca la ve.
    key: ${APITCG_KEY:}
