# Producción (EC2): MySQL + backend + Caddy. MySQL y el backend no publican puertos: solo se ven
# por la red interna de Docker. Caddy es la única entrada (80 y 443) y pone el HTTPS.
# Uso:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
name: holomarket-prod
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD en .env.prod}
      MYSQL_DATABASE: ${DB_NAME:-holomarket}
      MYSQL_USER: ${DB_USER:-holomarket}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env.prod}
      TZ: America/Santiago
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m

  api:
    build: .
    image: holomarket-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-holomarket}
      DB_USER: ${DB_USER:-holomarket}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PARAMS: ${DB_PARAMS:-useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env.prod}
      CORS_ORIGINS: ${CORS_ORIGINS:?Falta CORS_ORIGINS en .env.prod}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env.prod}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Falta DEMO_USER_PASSWORD en .env.prod}
      APITCG_KEY: ${APITCG_KEY:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    mem_limit: 900m

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO en .env.prod}
      IP_PUBLICA: ${IP_PUBLICA:?Falta IP_PUBLICA en .env.prod}
      FRONT_S3_HOST: ${FRONT_S3_HOST:?Falta FRONT_S3_HOST en .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificados de Let's Encrypt (no se pierden al reiniciar)
      - caddy_config:/config
    mem_limit: 128m

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
